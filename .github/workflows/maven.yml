name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build and run unit tests
      # The Maven reactor lives under backend/. Tests tagged "integration" need
      # Postgres/Kafka and are excluded here; everything else (unit, ArchUnit,
      # migration registry checks) runs on every push and pull request.
      run: mvn -B verify -DexcludedGroups=integration --file backend/pom.xml
    - name: Publish test summary
      if: always()
      run: |
        echo "## Surefire results" >> "$GITHUB_STEP_SUMMARY"
        for f in backend/*/target/surefire-reports/*.txt; do
          [ -f "$f" ] && grep -h "Tests run:" "$f" | head -1 | sed "s|^|$(basename "$f" .txt): |" >> "$GITHUB_STEP_SUMMARY"
        done
        true
