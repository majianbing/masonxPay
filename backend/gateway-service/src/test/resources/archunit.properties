# FreezingArchRule store: records violations that pre-date a rule so new ones fail while old ones are tracked.
# The store is committed; do not delete it to "fix" a failing rule. Remove entries only when the violation is resolved.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=true
freeze.refreeze=false
